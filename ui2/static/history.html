<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>History — Intern Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="main.css"/>
</head>
<body>
  <nav class="navbar container navbar-expand-lg"><a class="navbar-brand fw-bold" href="index.html">InternRecommender</a></nav>
  <main class="container py-5">
    <div id="historyBox" class="card p-4"></div>
    <div class="mt-3"><button id="clear" class="btn btn-outline-danger">Clear history</button> <a class="btn btn-link" href="index.html">New prediction</a></div>
  </main>

<script>
function render(){
  const h = JSON.parse(localStorage.getItem('pred_history')||'[]').slice().reverse();
  const box = document.getElementById('historyBox');
  if(!h.length) { box.innerHTML = '<p class="muted">No predictions yet.</p>'; return; }
  box.innerHTML = '<table class="table"><thead><tr><th>When</th><th>Top-1</th><th>Confidence</th></tr></thead><tbody>' +
    h.map(x=>{
      const ts = x.ts || new Date().toLocaleString();
      const top1 = (x.top3 && x.top3[0])? x.top3[0][0] : 'N/A';
      const conf = (x.top3 && x.top3[0])? (x.top3[0][1]*100).toFixed(1)+'%' : '-';
      return `<tr><td>${ts}</td><td>${top1}</td><td>${conf}</td></tr>`;
    }).join('') + '</tbody></table>';
}
document.getElementById('clear').addEventListener('click', ()=>{ if(confirm('Clear history?')){ localStorage.removeItem('pred_history'); render(); }});
render();
</script>
</body>
</html>
