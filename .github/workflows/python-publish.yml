name: Internship Recommendation CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5   # upgraded

      - name: Setup Python
        uses: actions/setup-python@v6   # upgraded
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model
        run: python main.py

      - name: Run Tests
        run: pytest || echo "No tests found"
